name: Course checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run check:content
      - run: npm test
      - run: python -B -m pytest tests/python -q -p no:cacheprovider
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      COURSE_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test tests/e2e/course.spec.ts tests/e2e/navigation.spec.ts --project desktop
      - run: npm run test:offline -- --project file-edge
